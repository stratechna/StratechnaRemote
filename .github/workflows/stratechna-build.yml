name: StratechnaRemote Builds

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Instala Flutter (inclui Dart) e coloca no PATH
      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install FVM
        shell: bash
        run: |
          dart --version
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          fvm --version
          fvm install 3.24.5
          fvm use 3.24.5 --force
          fvm flutter --version

      - name: Apply Stratechna branding (UI only)
        shell: bash
        run: |
          bash scripts_stratechna/05_apply_branding_flutter_ui.sh

      - name: Flutter pub get
        shell: bash
        run: |
          cd flutter
          fvm flutter pub get

      - name: Build Windows (Flutter)
        shell: bash
        run: |
          cd flutter
          fvm flutter build windows --release
          mkdir -p ../dist
          # procurar exe no output do build do Flutter
          EXE="$(find build/windows -type f -name "*.exe" | grep -i 'Release' | head -n 1 || true)"
          if [ -z "$EXE" ]; then
            EXE="$(find build/windows -type f -name "*.exe" | head -n 1 || true)"
          fi
          test -n "$EXE"
          cp -f "$EXE" ../dist/StratechnaRemote.exe

      - name: Zip (Windows)
        shell: bash
        run: |
          cd dist
          7z a -tzip ../StratechnaRemote-Windows-x86_64.zip StratechnaRemote.exe

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: StratechnaRemote-Windows-x86_64
          path: StratechnaRemote-Windows-x86_64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux deps for Flutter desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config git curl unzip zip \
            libgtk-3-dev libappindicator3-dev libvulkan-dev \
            libssl-dev libclang-dev \
            ninja-build \
            nasm yasm python3 python3-pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install FVM
        run: |
          dart --version
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          fvm --version
          fvm install 3.24.5
          fvm use 3.24.5 --force
          fvm flutter --version

      - name: Apply Stratechna branding (UI only)
        run: |
          bash scripts_stratechna/05_apply_branding_flutter_ui.sh

      - name: Flutter pub get
        run: |
          cd flutter
          fvm flutter pub get

      - name: Build Linux (Flutter)
        run: |
          cd flutter
          fvm flutter build linux --release
          mkdir -p ../dist
          # encontrar binário gerado
          BIN="$(find build/linux -type f -perm -111 2>/dev/null | head -n 1 || true)"
          test -n "$BIN"
          cp -f "$BIN" ../dist/StratechnaRemote
          strip ../dist/StratechnaRemote || true

      - name: Zip (Linux)
        run: |
          zip -9 -j StratechnaRemote-Linux-x86_64.zip dist/StratechnaRemote

      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: StratechnaRemote-Linux-x86_64
          path: StratechnaRemote-Linux-x86_64.zip
