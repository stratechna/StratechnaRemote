name: StratechnaRemote Builds

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FVM + Flutter 3.24.5
        shell: pwsh
        run: |
          choco install -y dart-sdk
          dart --version
          dart pub global activate fvm
          $env:PATH = "$env:USERPROFILE\AppData\Local\Pub\Cache\bin;$env:PATH"
          fvm install 3.24.5
          fvm use 3.24.5
          fvm flutter --version

      - name: Apply Stratechna branding (UI only)
        shell: pwsh
        run: |
          bash scripts_stratechna/05_apply_branding_flutter_ui.sh

      - name: Flutter pub get
        shell: pwsh
        run: |
          cd flutter
          fvm flutter pub get

      - name: Build Windows (Flutter)
        shell: pwsh
        run: |
          cd flutter
          fvm flutter build windows --release
          New-Item -ItemType Directory -Force ..\dist | Out-Null
          $exe = Get-ChildItem -Recurse build\windows -Filter "*.exe" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $exe) { throw "No exe found under flutter/build/windows" }
          Copy-Item $exe.FullName ..\dist\StratechnaRemote.exe

      - name: Zip (Windows)
        shell: pwsh
        run: |
          Compress-Archive -Path dist\StratechnaRemote.exe -DestinationPath StratechnaRemote-Windows-x86_64.zip -Force

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: StratechnaRemote-Windows-x86_64
          path: StratechnaRemote-Windows-x86_64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux deps for Flutter desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config git curl unzip zip \
            libgtk-3-dev libappindicator3-dev libvulkan-dev \
            libssl-dev libclang-dev \
            ninja-build \
            nasm yasm python3 python3-pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FVM + Flutter 3.24.5
        run: |
          dart --version || true
          sudo apt-get install -y dart || true
          dart --version
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          fvm install 3.24.5
          fvm use 3.24.5
          fvm flutter --version

      - name: Apply Stratechna branding (UI only)
        run: |
          bash scripts_stratechna/05_apply_branding_flutter_ui.sh

      - name: Flutter pub get
        run: |
          cd flutter
          fvm flutter pub get

      - name: Build Linux (Flutter)
        run: |
          cd flutter
          fvm flutter build linux --release
          mkdir -p ../dist
          # tentar encontrar binário no bundle
          BIN="$(find build/linux -type f -perm -111 -name 'rustdesk' -o -name 'StratechnaRemote' 2>/dev/null | head -n 1 || true)"
          if [ -z "$BIN" ]; then
            # fallback: procurar executável no bundle
            BIN="$(find build/linux -type f -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          test -n "$BIN"
          cp -f "$BIN" ../dist/StratechnaRemote
          strip ../dist/StratechnaRemote || true

      - name: Zip (Linux)
        run: |
          zip -9 -j StratechnaRemote-Linux-x86_64.zip dist/StratechnaRemote

      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: StratechnaRemote-Linux-x86_64
          path: StratechnaRemote-Linux-x86_64.zip
