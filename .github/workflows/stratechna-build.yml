name: StratechnaRemote Builds

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg $env:GITHUB_WORKSPACE\vcpkg
          & $env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install vcpkg deps
        shell: pwsh
        run: |
          & $env:VCPKG_ROOT\vcpkg.exe install `
            libvpx:x64-windows-static `
            libyuv:x64-windows-static `
            opus:x64-windows-static `
            aom:x64-windows-static

      - name: Build (Windows)
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\rustdesk.exe dist\StratechnaRemote.exe

      - name: Zip (Windows)
        shell: pwsh
        run: |
          Compress-Archive -Path dist\StratechnaRemote.exe -DestinationPath StratechnaRemote-Windows-x86_64.zip -Force

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: StratechnaRemote-Windows-x86_64
          path: StratechnaRemote-Windows-x86_64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config git curl unzip zip \
            libgtk-3-dev libappindicator3-dev libvulkan-dev \
            libssl-dev libclang-dev \
            nasm yasm python3 python3-pip

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (Linux)
        run: |
          cargo build --release
          mkdir -p dist
          cp -f target/release/rustdesk dist/StratechnaRemote
          strip dist/StratechnaRemote || true

      - name: Zip (Linux)
        run: |
          zip -9 -j StratechnaRemote-Linux-x86_64.zip dist/StratechnaRemote

      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: StratechnaRemote-Linux-x86_64
          path: StratechnaRemote-Linux-x86_64.zip
